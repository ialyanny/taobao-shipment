<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘寶集運單</title>
  <style>
    :root {
      --primary: #673ab7;
      --primary-dark: #512da8;
      --bg: #f0ebf8;
      --card: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --error: #d93025;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 12px 48px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 8px;
      border-top: 10px solid var(--primary);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, .3);
      margin-bottom: 16px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; color: var(--text); }
    .notice {
      background: #fef7e0;
      border: 1px solid #f9ab00;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: #7a5b00;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .notice strong { display: block; margin-bottom: 4px; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .required { color: var(--error); margin-left: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border .15s, box-shadow .15s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(103, 58, 183, .25);
    }
    .name-select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
      transition: border .15s, box-shadow .15s;
    }
    .name-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(103, 58, 183, .25);
    }
    .btn-copy {
      background: #f0f4f8;
      border: 1px solid #c5d6e7;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-copy:hover { background: #e3ecf5; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      user-select: none;
    }
    .radio-group input:checked + span { font-weight: 600; color: var(--primary-dark); }
    .radio-group label:has(input:checked) {
      background: #ede7f6;
      border-color: var(--primary);
    }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
      transition: background .15s, opacity .15s;
    }
    .btn-submit { background: var(--primary); color: #fff; }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-clear { background: transparent; color: var(--primary-dark); border: 1px solid var(--border); }
    .btn-clear:hover { background: #f3f0f8; }
    .btn-export { background: #1e8e3e; color: #fff; }
    .btn-export:hover { background: #178030; }
    .error { color: var(--error); font-size: 14px; margin-top: 6px; min-height: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8f9fa; position: sticky; top: 0; }
    .record-actions button {
      background: none; border: none; color: var(--error);
      padding: 2px 6px; font-size: 13px;
    }
    .record-actions button:hover { text-decoration: underline; }
    .empty { text-align: center; color: #80868b; padding: 24px 0; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #323232; color: #fff; padding: 12px 24px; border-radius: 6px;
      font-size: 15px; opacity: 0; pointer-events: none;
      transition: opacity .25s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .summary { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
    .summary div { font-size: 14px; }
    .summary span { font-weight: 700; color: var(--primary-dark); }
    .filter-row { margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .filter-btn {
      padding: 6px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      user-select: none;
    }
    .filter-btn:hover { background: #f3f0f8; }
    .filter-btn.active { background: #ede7f6; border-color: var(--primary); font-weight: 600; color: var(--primary-dark); }
    .filter-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .filter-checkboxes label { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; cursor: pointer; user-select: none; transition: background .15s, border-color .15s; }
    .filter-checkboxes input[type="checkbox"] { accent-color: var(--primary); width: 14px; height: 14px; }
    .filter-checkboxes label:has(input:checked) { background: #ede7f6; border-color: var(--primary); font-weight: 600; color: var(--primary-dark); }
    .cell-with-copy { display: flex; align-items: center; gap: 4px; }
    .btn-copy { background: none; border: none; cursor: pointer; padding: 2px 6px; font-size: 12px; color: var(--primary); border-radius: 4px; opacity: 0.6; transition: opacity .15s; }
    .btn-copy:hover { opacity: 1; background: #ede7f6; }
    .success-banner {
      background: #e6f4ea; border: 1px solid #34a853; color: #137333;
      border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      font-size: 14px; display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>淘寶集運單</h1>
      <p style="margin-bottom:12px;font-size:15px;line-height:1.7;">
        請填入訂單號、品項、金額，勾選姓名（必填），方便申報集運及避免系統未入倉。
        如有輸入錯誤訊息，請重新填寫一筆。
      </p>
      <div class="notice">
        <strong>請注意</strong>
        • 廈門海快集運倉無法運送食品<br>
        • 11/14 之後運費每公斤調漲 0.5 人民幣，原 6.5 → 7 元，包稅 2 元，每公斤運費 9 人民幣<br>
        • 12/15 之後再漲價，11 公斤以上，每公斤 8 元人民幣，包稅 10 元人民幣
      </div>

      <form id="shipmentForm" novalidate>
        <div class="field">
          <label for="orderNo">單號</label>
          <input type="text" id="orderNo" name="orderNo" placeholder="請輸入訂單號" autocomplete="off">
        </div>
        <div class="field">
          <label for="item">品項</label>
          <input type="text" id="item" name="item" placeholder="請輸入品項" autocomplete="off">
        </div>
        <div class="field">
          <label for="amount">金額</label>
          <input type="text" id="amount" name="amount" placeholder="請輸入金額" autocomplete="off">
        </div>
      <div class="field">
        <label for="nameSelect">姓名<span class="required">*</span></label>
        <select id="nameSelect" class="name-select" required>
          <option value="">請選擇姓名</option>
        </select>
        <div class="error" id="nameError"></div>
      </div>
        <div class="btn-row">
          <button type="submit" class="btn-submit">提交</button>
          <button type="button" class="btn-clear" id="btnClear">清除表單</button>
        </div>
      </form>
    </div>

    <div class="success-banner" id="successBanner"></div>

    <div class="card">
      <h2 style="font-size:20px;margin-bottom:8px;">提交記錄</h2>
      <div class="filter-row">
        <span style="font-size:14px;margin-right:8px;">篩選姓名：</span>
        <div id="nameFilter" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div class="summary">
        <div>共 <span id="totalCount">0</span> 筆</div>
        <div>總金額 <span id="totalAmount">0</span> 元</div>
        <div style="display:flex;gap:8px;margin-left:auto;align-items:center;">
          <span style="font-size:14px;">快速複製：</span>
          <button type="button" class="btn-copy" data-target="orderNo">複製單號</button>
          <button type="button" class="btn-copy" data-target="item">複製品項</button>
          <button type="button" class="btn-export" id="btnExport">匯出 CSV</button>
        </div>
      </div>
      <div style="max-height:420px;overflow:auto;">
        <table>
          <thead>
            <tr><th><input type="checkbox" id="selectAll"></th><th>時間</th><th>姓名</th><th>單號</th><th>品項</th><th>金額</th><th></th></tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyText">尚無提交記錄</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
var STORAGE_KEY = 'taobao_shipment_records';
      // 貼上 Apps Script Web App 網址（部署後）。留空 = 僅用本機 localStorage
      var API_URL = 'https://script.google.com/macros/s/AKfycbxRxs7i8Te9D3rRQDp3FNtb2V_ZtMQhk5M9pZDCXg0buTorsVdr6COD57puzZ9o0Tyd/exec';
      var LOCAL_ONLY = !API_URL;
      var INITIAL_RECORDS = [{"time":1784319875000,"name":"弟","orderNo":"435272535982156","item":"褲子","amount":"0"},{"time":1783189726000,"name":"俊賢","orderNo":"79016123773267","item":"座椅靠背","amount":"47.62"},{"time":1783550938000,"name":"俊賢","orderNo":"79016123773267","item":"座椅靠","amount":"47.62"},{"time":1784296380000,"name":"榮吉","orderNo":"9822789936997","item":"衣物除味噴霧","amount":"0"},{"time":1782723847000,"name":"俊賢","orderNo":"YT7629416487634","item":"轉接頭","amount":"4.59"},{"time":1783292462000,"name":"俊賢","orderNo":"79014568353156","item":"強力磁鐵","amount":"1.89元"},{"time":1783337040000,"name":"榮吉","orderNo":"773430298305689","item":"眼線筆","amount":"0"},{"time":1783873464000,"name":"榮吉","orderNo":"435266561020411","item":"67W快充線","amount":"0"},{"time":1783952041000,"name":"榮吉","orderNo":"JT3170121905771","item":"測電筆","amount":"0"},{"time":1783897780000,"name":"俊賢","orderNo":"YT7631445333130","item":"收納盒","amount":"2.01元"},{"time":1784207750000,"name":"榮吉","orderNo":"9822779604858","item":"定妝噴霧","amount":"0"},{"time":1782228397000,"name":"俊賢","orderNo":"773426545571792","item":"陶瓷蒸籠","amount":"24.3元"},{"time":1782235638000,"name":"俊賢","orderNo":"79014009539615","item":"冰霸杯","amount":"18.82"},{"time":1782286450000,"name":"俊賢","orderNo":"79116507025694","item":"藍芽接收器","amount":"42.9"},{"time":1782286492000,"name":"俊賢","orderNo":"YT8879717510828","item":"轉接頭","amount":"13.5"},{"time":1782338541000,"name":"弟","orderNo":"773427544569349","item":"保護貼","amount":"14.35"},{"time":1784484941000,"name":"榮吉","orderNo":"435276290900047","item":"吃瓜神器","amount":"0"},{"time":1782513459000,"name":"俊賢","orderNo":"79014568353156","item":"強力磁鐵","amount":"5元"},{"time":1783189778000,"name":"俊賢","orderNo":"73600478536863","item":"手機殼","amount":"100.28"},{"time":1783189941000,"name":"俊賢","orderNo":"79116507025694","item":"藍芽接收器","amount":"42.9"},{"time":1783189819000,"name":"俊賢","orderNo":"YT7629416487634","item":"轉接頭","amount":"4.59"},{"time":1783189886000,"name":"俊賢","orderNo":"YT8880636814779","item":"雨傘","amount":"11.06"},{"time":1784319898000,"name":"弟","orderNo":"YT7633193521247","item":"褲子1","amount":"0"},{"time":1784319956000,"name":"弟","orderNo":"773431765309218","item":"玻璃貼","amount":"0"},{"time":1784320053000,"name":"弟","orderNo":"773431758134690","item":"玻璃貼1","amount":"0"},{"time":1784320081000,"name":"弟","orderNo":"YT7632896479356","item":"充電器","amount":"0"},{"time":1784320106000,"name":"弟","orderNo":"79018899130936","item":"充電器1","amount":"0"},{"time":1784320129000,"name":"弟","orderNo":"YT7632898574570","item":"充電線","amount":"0"},{"time":1784737218000,"name":"Hebe","orderNo":"YT0057803917151","item":"衣服","amount":"100"},{"time":1785111442000,"name":"榮吉","orderNo":"JT3171664587193","item":"電競指套","amount":"0"},{"time":1785278413000,"name":"Hebe","orderNo":"770335249124628","item":"衣服","amount":"100"},{"time":1785332469000,"name":"俊賢","orderNo":"9822835052492","item":"香薰","amount":"0.99"},{"time":1785332515000,"name":"俊賢","orderNo":"79020255221536","item":"藍芽接收器","amount":"11.04"},{"time":1785332590000,"name":"俊賢","orderNo":"79020305825655","item":"藍芽音頻接收器","amount":"28.84"},{"time":1785332657000,"name":"俊賢","orderNo":"JT3170599843390","item":"耳機轉接線","amount":"7.69"},{"time":1783884033000,"name":"榮吉","orderNo":"JT3170097566028","item":"去污膏","amount":"0"},{"time":1785481461000,"name":"弟","orderNo":"SF5112962902449","item":"保護套","amount":"0"},{"time":1785481487000,"name":"弟","orderNo":"79021580267193","item":"充電線","amount":"0"},{"time":1785665628000,"name":"榮吉","orderNo":"79022871145996","item":"拼豆補充包","amount":"0"},{"time":1785667688000,"name":"榮吉","orderNo":"773434710903862","item":"藍芽耳機","amount":"0"},{"time":1785695129000,"name":"榮吉","orderNo":"9822899066964","item":"耳塞","amount":"0"},{"time":1785695178000,"name":"榮吉","orderNo":"435295643351172","item":"耳洞清潔器","amount":"0"},{"time":1784635685000,"name":"榮吉","orderNo":"JT3171090028762","item":"外出背包","amount":"0"},{"time":1784660978000,"name":"榮吉","orderNo":"9822818624350","item":"香氛","amount":"0"},{"time":1785749782000,"name":"俊賢","orderNo":"79127598165487","item":"頭盔耳機","amount":"57.34"},{"time":1785749845000,"name":"俊賢","orderNo":"JT5506335502948","item":"麥克風","amount":"5.4"},{"time":1785749959000,"name":"俊賢","orderNo":"79020305825655","item":"藍芽音頻接收器","amount":"28.84"},{"time":1785750016000,"name":"俊賢","orderNo":"79020255221536","item":"5.3音頻接收器","amount":"11.04"},{"time":1785760133000,"name":"Hebe","orderNo":"79022917754324","item":"衣服","amount":"100"},{"time":1785777651000,"name":"榮吉","orderNo":"773434828480463","item":"美甲磁鐵棒","amount":"0"},{"time":1785777702000,"name":"榮吉","orderNo":"9822904532251","item":"拼豆筆","amount":"0"},{"time":1785795133000,"name":"俊賢","orderNo":"JT5511428018522","item":"雨衣","amount":"11.97"},{"time":1785795199000,"name":"俊賢","orderNo":"JT5511585053529","item":"外套","amount":"13.8"},{"time":1785795261000,"name":"俊賢","orderNo":"JT5511614179773","item":"藍芽接收器","amount":"24.04"},{"time":1785835977000,"name":"榮吉","orderNo":"YT7636433267767","item":"拼豆針","amount":"0"},{"time":1785836009000,"name":"榮吉","orderNo":"773434948184628","item":"刮鬍刀","amount":"0"},{"time":1785837467000,"name":"榮吉","orderNo":"9822909716382","item":"圖釘1","amount":"0"},{"time":1785837541000,"name":"榮吉","orderNo":"773434976323581","item":"圖釘2","amount":"0"}]
;
      var NAMES = ['俊賢', '榮吉', '小惠', 'Hebe', '弟', '妹', '育源', '武昌', '曉君'];

      var form = document.getElementById('shipmentForm');
      var orderNo = document.getElementById('orderNo');
      var item = document.getElementById('item');
      var amount = document.getElementById('amount');
      var nameSelect = document.getElementById('nameSelect');
      var nameError = document.getElementById('nameError');
      var successBanner = document.getElementById('successBanner');
      var recordsBody = document.getElementById('recordsBody');
      var emptyText = document.getElementById('emptyText');
      var totalCount = document.getElementById('totalCount');
      var totalAmount = document.getElementById('totalAmount');
      var nameFilter = document.getElementById('nameFilter');
      var toast = document.getElementById('toast');

      function buildNameSelect() {
        NAMES.forEach(function (n) {
          var opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          nameSelect.appendChild(opt);
        });
      }

      function apiRequest(action, payload) {
        if (!API_URL) {
          return Promise.reject(new Error('API_URL 未設定'));
        }
        var params = 'action=' + encodeURIComponent(action);
        if (payload) {
          Object.keys(payload).forEach(function (k) {
            params += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(payload[k]);
          });
        }
        return fetch(API_URL + '?' + params)
          .then(function (r) { return r.json(); });
      }

      function getRecords() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw && INITIAL_RECORDS && INITIAL_RECORDS.length) {
            saveRecords(INITIAL_RECORDS);
            return INITIAL_RECORDS.slice();
          }
          var arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }

      function saveRecords(records) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function loadFromRemote() {
        return apiRequest('get').then(function (res) {
          if (res && res.ok && Array.isArray(res.records)) {
            saveRecords(res.records);
            return res.records;
          }
          throw new Error(res && res.error ? res.error : 'load failed');
        });
      }

      function formatTime(ts) {
        var d = new Date(ts);
        function p(x) { return x < 10 ? '0' + x : '' + x; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

      var currentFilter = 'all';

      function updateNameFilter() {
        var records = getRecords();
        var names = [];
        records.forEach(function (r) { if (names.indexOf(r.name) === -1) names.push(r.name); });
        names.sort();
        nameFilter.innerHTML = '';
        var btnAll = document.createElement('button');
        btnAll.type = 'button';
        btnAll.className = 'filter-btn';
        btnAll.dataset.name = 'all';
        btnAll.textContent = '全部';
        nameFilter.appendChild(btnAll);
        names.forEach(function (n) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-btn';
          btn.dataset.name = n;
          btn.textContent = n;
          nameFilter.appendChild(btn);
        });
        var target = (names.indexOf(currentFilter) !== -1) ? currentFilter : 'all';
        nameFilter.querySelectorAll('.filter-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.name === target);
        });
        currentFilter = target;
      }

      function render() {
        var all = getRecords();
        updateNameFilter();
        var records = currentFilter === 'all'
          ? all.slice()
          : all.filter(function (r) { return r.name === currentFilter; });

        recordsBody.innerHTML = '';
        totalCount.textContent = records.length;

        var sum = 0;
        records.forEach(function (r) {
          var num = parseFloat(r.amount);
          if (!isNaN(num)) sum += num;
        });
        totalAmount.textContent = Math.round(sum * 100) / 100;

        if (records.length === 0) {
          emptyText.style.display = 'block';
          return;
        }
        emptyText.style.display = 'none';

        records.forEach(function (r) {
          var tr = document.createElement('tr');
          var tdCheck = document.createElement('td');
          var chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.className = 'row-check';
          chk.dataset.orderNo = r.orderNo;
          chk.dataset.item = r.item;
          tdCheck.appendChild(chk);
          var tdTime = document.createElement('td');
          tdTime.textContent = formatTime(r.time);
          var tdName = document.createElement('td');
          tdName.textContent = r.name;
          var tdOrder = document.createElement('td');
          tdOrder.textContent = r.orderNo;
          var tdItem = document.createElement('td');
          tdItem.textContent = r.item;
          var tdAmount = document.createElement('td');
          tdAmount.textContent = r.amount;
          var tdAct = document.createElement('td');
          tdAct.className = 'record-actions';
          var delBtn = document.createElement('button');
          delBtn.textContent = '刪除';
          delBtn.type = 'button';
          delBtn.addEventListener('click', function () {
            if (LOCAL_ONLY || !r.row) {
              var records2 = getRecords();
              var target = -1;
              for (var i = 0; i < records2.length; i++) {
                if (records2[i].time === r.time && records2[i].orderNo === r.orderNo) { target = i; break; }
              }
              if (target !== -1) records2.splice(target, 1);
              saveRecords(records2);
              render();
              showToast('已刪除該筆記錄');
            } else {
              apiRequest('delete', { row: r.row }).then(function (res) {
                if (res && res.ok) {
                  if (Array.isArray(res.records)) saveRecords(res.records);
                  render();
                  showToast('已刪除該筆記錄');
                } else {
                  showToast('刪除失敗：' + (res && res.error ? res.error : '未知錯誤'));
                }
              }).catch(function () {
                showToast('連線失敗，無法刪除');
              });
            }
          });
          tdAct.appendChild(delBtn);
          tr.appendChild(tdCheck);
          tr.appendChild(tdTime);
          tr.appendChild(tdName);
          tr.appendChild(tdOrder);
          tr.appendChild(tdItem);
          tr.appendChild(tdAmount);
          tr.appendChild(tdAct);
          recordsBody.appendChild(tr);
        });
      }

      nameFilter.addEventListener('click', function (e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        currentFilter = btn.dataset.name;
        nameFilter.querySelectorAll('.filter-btn').forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
        render();
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      }

      function showSuccess(msg) {
        successBanner.textContent = msg;
        successBanner.style.display = 'block';
        clearTimeout(showSuccess._t);
        showSuccess._t = setTimeout(function () { successBanner.style.display = 'none'; }, 4000);
      }

      function copyText(text, btn) {
        function done() {
          if (btn) { btn.textContent = '已複製'; setTimeout(function () { btn.textContent = '複製'; }, 1500); }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(); });
        } else {
          fallbackCopy();
        }
        function fallbackCopy() {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); } catch (e) { showToast('複製失敗'); }
          document.body.removeChild(ta);
        }
      }

      document.querySelectorAll('.btn-copy').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var target = btn.getAttribute('data-target');
          var checks = document.querySelectorAll('.row-check:checked');
          if (checks.length === 0) {
            showToast('請先勾選要複製的紀錄');
            return;
          }
          var values = [];
          checks.forEach(function (c) {
            var val = target === 'orderNo' ? c.dataset.orderNo : c.dataset.item;
            if (val) values.push(val);
          });
          if (values.length === 0) {
            showToast('勾選紀錄無資料');
            return;
          }
          copyText(values.join('\n'), btn);
        });
      });

      document.getElementById('selectAll').addEventListener('change', function (e) {
        var checks = document.querySelectorAll('.row-check');
        checks.forEach(function (c) { c.checked = e.target.checked; });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        nameError.textContent = '';
        var selectedName = nameSelect.value;
        if (!selectedName) {
          nameError.textContent = '請選擇姓名';
          return;
        }
        if (!orderNo.value.trim() || !item.value.trim() || !amount.value.trim()) {
          nameError.textContent = '請完整填寫單號、品項與金額';
          return;
        }

        var records = getRecords();
        var inputOrder = orderNo.value.trim();
        var dup = records.find(function (r) { return r.orderNo === inputOrder; });
        if (dup) {
          nameError.textContent = '單號 ' + inputOrder + ' 已存在（' + dup.name + '，' + formatTime(dup.time) + '），請確認是否重複輸入';
          return;
        }

        if (LOCAL_ONLY) {
          records.push({
            time: Date.now(),
            name: selectedName,
            orderNo: inputOrder,
            item: item.value.trim(),
            amount: amount.value.trim()
          });
          saveRecords(records);
          render();
          showSuccess('已提交：' + selectedName + ' — ' + inputOrder);
        } else {
          apiRequest('add', {
            name: selectedName,
            orderNo: inputOrder,
            item: item.value.trim(),
            amount: amount.value.trim()
          }).then(function (res) {
            if (res && res.ok) {
              if (Array.isArray(res.records)) saveRecords(res.records);
              render();
              showSuccess('已提交：' + selectedName + ' — ' + inputOrder);
            } else if (res && res.error === 'duplicate') {
              nameError.textContent = res.message || ('單號 ' + inputOrder + ' 已存在，請確認是否重複輸入');
            } else {
              nameError.textContent = '提交失敗：' + (res && res.error ? res.error : '未知錯誤');
            }
          }).catch(function () {
            nameError.textContent = '連線失敗，無法提交（請檢查 API 設定）';
          });
        }
        form.reset();
        nameSelect.value = '';
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        form.reset();
        nameError.textContent = '';
        nameSelect.value = '';
      });

      document.getElementById('btnExport').addEventListener('click', function () {
        var checks = document.querySelectorAll('.row-check:checked');
        if (checks.length === 0) {
          showToast('請先勾選要匯出的紀錄');
          return;
        }
        var all = getRecords();
        var rows = [['時間', '姓名', '單號', '品項', '金額']];
        checks.forEach(function (c) {
          var rec = all.find(function (r) { return r.orderNo === c.dataset.orderNo; });
          if (rec) rows.push([formatTime(rec.time), rec.name, rec.orderNo, rec.item, rec.amount]);
        });
        var csv = rows.map(function (row) {
          return row.map(function (cell) {
            return '"' + String(cell).replace(/"/g, '""') + '"';
          }).join(',');
        }).join('\r\n');
        var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '淘寶集運單_' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast('CSV 已匯出 ' + checks.length + ' 筆');
      });

      buildNameSelect();
      if (LOCAL_ONLY) {
        render();
      } else {
        loadFromRemote().then(function () {
          render();
        }).catch(function () {
          render();
          showToast('遠端載入失敗，顯示本機資料');
        });
      }
    })();
  </script>
</body>
</html>
