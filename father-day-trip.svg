<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&amp;display=swap');
      text{font-family:'Noto Sans TC',sans-serif}
      .road{fill:none;stroke:#8D6E63;stroke-width:12;stroke-linecap:round}
      .road-center{fill:none;stroke:#FFF;stroke-width:2;stroke-dasharray:15,10;opacity:.6}
      .title-text{font-size:42px;font-weight:900;fill:#5D4037}
      .subtitle-text{font-size:18px;fill:#795548}
      .time-text{font-size:14px;font-weight:700;fill:#fff}
      .place-text{font-size:16px;font-weight:700;fill:#5D4037}
      .detail-text{font-size:12px;fill:#616161}
      .warning-text{font-size:11px;fill:#E65100}
      .tips-text{font-size:13px;fill:#5D4037}

      .car{animation:driveCar 8s ease-in-out infinite}
      @keyframes driveCar{
        0%{transform:translate(100px,120px)}
        15%{transform:translate(280px,200px)}
        35%{transform:translate(500px,180px)}
        55%{transform:translate(680px,250px)}
        75%{transform:translate(900px,200px)}
        100%{transform:translate(1050px,150px)}
      }
      .car-bounce{animation:carBounce .5s ease-in-out infinite}
      @keyframes carBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

      .cloud-float{animation:cloudMove 12s ease-in-out infinite}
      @keyframes cloudMove{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
      .cloud-float2{animation:cloudMove2 15s ease-in-out infinite}
      @keyframes cloudMove2{0%,100%{transform:translateX(0)}50%{transform:translateX(-25px)}}

      .water-dance{animation:waterPulse 2s ease-in-out infinite}
      @keyframes waterPulse{0%,100%{opacity:.3;transform:scaleY(1)}50%{opacity:.8;transform:scaleY(1.3)}}

      .node-pulse{animation:nodePulse 2s ease-in-out infinite}
      @keyframes nodePulse{0%,100%{r:22;opacity:1}50%{r:26;opacity:.8}}

      .fade-in{opacity:0;animation:fadeIn .8s ease-out forwards}
      .fade-in-d1{animation-delay:.2s}.fade-in-d2{animation-delay:.5s}
      .fade-in-d3{animation-delay:.8s}.fade-in-d4{animation-delay:1.1s}
      .fade-in-d5{animation-delay:1.4s}.fade-in-d6{animation-delay:1.7s}
      @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

      .tree-sway{animation:treeSway 3s ease-in-out infinite}
      @keyframes treeSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
    </style>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#B3E5FC"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A1887F"/>
      <stop offset="50%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#A1887F"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowLarge">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  <ellipse cx="150" cy="750" rx="700" ry="120" fill="url(#grassGrad)"/>
  <ellipse cx="900" cy="780" rx="500" ry="100" fill="#66BB6A"/>

  <!-- Clouds -->
  <g class="cloud-float" opacity=".7">
    <ellipse cx="200" cy="60" rx="60" ry="20" fill="#fff"/>
    <ellipse cx="180" cy="50" rx="35" ry="22" fill="#fff"/>
    <ellipse cx="230" cy="48" rx="40" ry="25" fill="#fff"/>
  </g>
  <g class="cloud-float2" opacity=".6">
    <ellipse cx="900" cy="80" rx="55" ry="18" fill="#fff"/>
    <ellipse cx="880" cy="70" rx="30" ry="20" fill="#fff"/>
    <ellipse cx="920" cy="68" rx="38" ry="22" fill="#fff"/>
  </g>

  <!-- Trees -->
  <g class="tree-sway" style="transform-origin:50px 650px">
    <rect x="45" y="620" width="10" height="40" fill="#795548" rx="2"/>
    <polygon points="50,580 25,630 75,630" fill="#388E3C"/>
    <polygon points="50,600 30,640 70,640" fill="#43A047"/>
  </g>
  <g class="tree-sway" style="transform-origin:1150px 660px;animation-delay:1s">
    <rect x="1145" y="630" width="10" height="40" fill="#795548" rx="2"/>
    <polygon points="1150,590 1125,640 1175,640" fill="#388E3C"/>
    <polygon points="1150,610 1130,650 1170,650" fill="#43A047"/>
  </g>
  <g class="tree-sway" style="transform-origin:100px 670px;animation-delay:.5s">
    <rect x="95" y="640" width="10" height="35" fill="#795548" rx="2"/>
    <polygon points="100,605 78,645 122,645" fill="#2E7D32"/>
    <polygon points="100,620 82,655 118,655" fill="#388E3C"/>
  </g>

  <!-- Road -->
  <path d="M80,130 Q200,200 300,180 Q450,160 550,200 Q650,240 750,220 Q850,200 950,180 Q1050,160 1120,150" class="road" stroke="url(#roadGrad)"/>
  <path d="M80,130 Q200,200 300,180 Q450,160 550,200 Q650,240 750,220 Q850,200 950,180 Q1050,160 1120,150" class="road-center"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title-text">&#x1F697; &#x7236;&#x89AA;&#x7BC0;&#x806F;&#x9910;&#x4E00;&#x65E5;&#x904A; &#x1F697;</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle-text">14:00 &#x51FA;&#x767C; &#x2192; 20:30+ &#x5145;&#x5BE6;&#x6D6A;&#x6F2B;&#x9806;&#x6642;&#x5C45;&#x5BB6;</text>

  <!-- Animated Car -->
  <g class="car car-bounce">
    <rect x="-20" y="-12" width="40" height="18" rx="8" fill="#E53935"/>
    <rect x="-15" y="-18" width="22" height="10" rx="5" fill="#EF5350"/>
    <circle cx="-12" cy="8" r="5" fill="#333"/>
    <circle cx="12" cy="8" r="5" fill="#333"/>
    <circle cx="-12" cy="8" r="2" fill="#666"/>
    <circle cx="12" cy="8" r="2" fill="#666"/>
    <rect x="16" y="-8" width="5" height="4" rx="2" fill="#FFF59D"/>
  </g>

  <!-- Stop 1: START -->
  <g class="fade-in fade-in-d1" filter="url(#shadow)">
    <circle cx="120" cy="130" r="22" fill="#4CAF50" class="node-pulse"/>
    <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">&#x1F697;</text>
    <rect x="30" y="85" width="180" height="35" rx="17" fill="#4CAF50" opacity=".9"/>
    <text x="120" y="107" text-anchor="middle" class="time-text">14:00 &#x51FA;&#x767C;</text>
    <text x="120" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#5D4037">&#x5BB6;&#x4EBA;&#x96C6;&#x5408;&#x51FA;&#x767B;</text>
  </g>

  <!-- Stop 2: Pin Huang Coffee -->
  <g class="fade-in fade-in-d2" filter="url(#shadowLarge)">
    <circle cx="310" cy="180" r="22" fill="#8D6E63" class="node-pulse"/>
    <text x="310" y="185" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">1</text>
    <rect x="220" y="90" width="180" height="70" rx="15" fill="#fff" opacity=".95"/>
    <text x="228" y="112" font-size="18">&#x2615;</text>
    <text x="248" y="112" class="place-text">&#x54C1;&#x7687;&#x5496;&#x5561;&#x89C0;&#x5149;&#x5DE5;&#x5EE3;</text>
    <rect x="228" y="118" width="100" height="20" rx="10" fill="#FF9800"/>
    <text x="278" y="132" text-anchor="middle" class="time-text">14:50-15:50</text>
    <text x="228" y="152" class="detail-text">&#x2022; &#x8A8D;&#x8B58;&#x5496;&#x5561;&#x6587;&#x5316; &#x2022; &#x514D;&#x8CBB;&#x8A66;&#x98F2;</text>
    <text x="320" y="152" class="detail-text">&#x2022; &#x6311;&#x9078;&#x4F34;&#x624B;&#x79AE;</text>
  </g>

  <!-- Travel time indicator -->
  <text x="380" y="218" text-anchor="middle" font-size="11" fill="#78909C">&#x2191; &#x7D04;50 MIN &#x2191;</text>

  <!-- Stop 3: Aimu Village -->
  <g class="fade-in fade-in-d3" filter="url(#shadowLarge)">
    <circle cx="560" cy="200" r="22" fill="#8D6E63" class="node-pulse"/>
    <text x="560" y="205" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">2</text>
    <rect x="470" y="100" width="180" height="85" rx="15" fill="#fff" opacity=".95"/>
    <text x="478" y="122" font-size="18">&#x1F3F0;</text>
    <text x="498" y="122" class="place-text">&#x611B;&#x6728;&#x6751;&#x5730;&#x65B9;&#x6587;&#x5316;&#x9928;</text>
    <rect x="478" y="128" width="100" height="20" rx="10" fill="#FF9800"/>
    <text x="528" y="142" text-anchor="middle" class="time-text">16:10-17:15</text>
    <text x="478" y="162" class="detail-text">&#x2022; &#x6A8F;&#x6728;&#x9999;&#x6C23;&#x74B0;&#x5883;</text>
    <text x="478" y="175" class="detail-text">&#x2022; &#x61F6;&#x820A;&#x6728;&#x5DE5;&#x5C55;&#x793A;</text>
    <text x="478" y="188" class="detail-text">&#x2022; &#x8DA3;&#x5473;&#x6728;&#x4F5C;&#x9AD4;&#x9A57;</text>
  </g>
  <text x="620" y="240" text-anchor="middle" font-size="11" fill="#78909C">&#x2191; &#x7D04;20 MIN &#x2191;</text>

  <!-- Stop 4: Seafood Restaurant -->
  <g class="fade-in fade-in-d4" filter="url(#shadowLarge)">
    <circle cx="770" cy="220" r="22" fill="#8D6E63" class="node-pulse"/>
    <text x="770" y="225" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">3</text>
    <rect x="680" y="110" width="180" height="90" rx="15" fill="#fff" opacity=".95"/>
    <text x="688" y="132" font-size="18">&#x1F990;</text>
    <text x="708" y="132" class="place-text">&#x9AD4;&#x80B2;&#x9928;&#x6D77;&#x9BAE;</text>
    <rect x="688" y="138" width="100" height="20" rx="10" fill="#FF9800"/>
    <text x="738" y="152" text-anchor="middle" class="time-text">17:25-18:55</text>
    <text x="688" y="172" class="detail-text">&#x2022; &#x5728;&#x5730;&#x5751;&#x73CE;&#x649E;&#x6D77;&#x9BAE;</text>
    <text x="688" y="185" class="detail-text">&#x2022; &#x9700;&#x73FE;&#x5834;&#x6392;&#x4F4D;</text>
    <text x="688" y="198" class="warning-text">&#x26A0; &#x5EFA;&#x6BCE;&#x63D0;&#x65E9;&#x9032;&#x5834;&#x6392;&#x968A;</text>
  </g>
  <text x="850" y="255" text-anchor="middle" font-size="11" fill="#78909C">&#x2191; &#x7D04;10 MIN &#x2191;</text>

  <!-- Stop 5: Palace Museum Water Dance -->
  <g class="fade-in fade-in-d5" filter="url(#shadowLarge)">
    <circle cx="1000" cy="160" r="22" fill="#8D6E63" class="node-pulse"/>
    <text x="1000" y="165" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">4</text>
    <rect x="880" y="70" width="180" height="85" rx="15" fill="#fff" opacity=".95"/>
    <text x="888" y="92" font-size="18">&#x1F3EF;</text>
    <text x="908" y="92" class="place-text">&#x6545;&#x5BAE;&#x5357;&#x9662;&#x6C34;&#x821E;</text>
    <rect x="888" y="98" width="100" height="20" rx="10" fill="#FF9800"/>
    <text x="938" y="112" text-anchor="middle" class="time-text">19:30-20:30</text>
    <text x="888" y="132" class="detail-text">&#x2022; &#x6B23;&#x8CDE;&#x7167;&#x5149;&#x6C34;&#x5E55;&#x79C0;</text>
    <text x="888" y="145" class="detail-text">&#x2022; &#x7559;&#x610F;&#x6642;&#x9593;&#x5225;&#x932F;&#x904E;</text>
    <text x="888" y="158" class="warning-text">&#x26A0; &#x6E5F;&#x77BF;&#x98A8;&#x5927;&#xFF0C;&#x5EFA;&#x6BCE;&#x643A;&#x5E36;&#x5916;&#x5957;</text>
  </g>

  <!-- Water Dance Animation -->
  <g transform="translate(1060,200)">
    <rect x="0" y="0" width="4" height="20" fill="#29B6F6" opacity=".5" class="water-dance"/>
    <rect x="8" y="5" width="4" height="25" fill="#29B6F6" opacity=".6" class="water-dance" style="animation-delay:.3s"/>
    <rect x="16" y="2" width="4" height="22" fill="#29B6F6" opacity=".5" class="water-dance" style="animation-delay:.6s"/>
    <rect x="24" y="7" width="4" height="18" fill="#29B6F6" opacity=".7" class="water-dance" style="animation-delay:.9s"/>
    <rect x="32" y="0" width="4" height="24" fill="#29B6F6" opacity=".5" class="water-dance" style="animation-delay:1.2s"/>
  </g>

  <!-- Finish -->
  <g class="fade-in fade-in-d6" filter="url(#shadow)">
    <circle cx="1120" cy="150" r="22" fill="#FF9800" class="node-pulse"/>
    <text x="1120" y="155" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">&#x1F3E0;</text>
    <rect x="1030" y="170" width="180" height="35" rx="17" fill="#FF9800" opacity=".9"/>
    <text x="1120" y="192" text-anchor="middle" class="time-text">20:30+ &#x5145;&#x5BE6;&#x6D6A;&#x6F2B;&#x9806;&#x6642;&#x5C45;&#x5BB6;</text>
  </g>

  <!-- Tips Box -->
  <g class="fade-in fade-in-d6" filter="url(#shadowLarge)">
    <rect x="50" y="680" width="1100" height="90" rx="15" fill="#FFF9C4" opacity=".95"/>
    <text x="70" y="710" font-size="16" font-weight="700" fill="#F57F17">&#x1F4A1; &#x51FA;&#x904A;&#x5C0F;&#x53EE;&#x5631;</text>
    <text x="70" y="735" class="tips-text">&#x2022; &#x9580;&#x7968;&#xFF1A;&#x611B;&#x6728;&#x6751;100&#x5143;/&#x4EBA;(&#x53EF;&#x6298;&#x62B5;&#x9928;&#x5167;&#x6D88;&#x8CBB;50&#x5143;)</text>
    <text x="70" y="755" class="tips-text">&#x2022; &#x6642;&#x6BB5;&#x6D41;&#x611F;&#xFF1A;&#x9AD4;&#x80B2;&#x9928;&#x6D77;&#x9BAE;&#x73FE;&#x5834;&#x6392;&#x4F4D;&#xFF0C;&#x8ACB;&#x8996;&#x72B6;&#x6CC1;&#x8ABF;&#x6574;</text>
    <text x="450" y="735" class="tips-text">&#x2022; &#x591C;&#x9593;&#x6C34;&#x821E;&#xFF1A;&#x6E5F;&#x77BF;&#x98A8;&#x5927;&#xFF0C;&#x5EFA;&#x6BCE;&#x643A;&#x5E36;&#x5916;&#x5957;</text>
    <text x="450" y="755" class="tips-text">&#x2022; &#x63D0;&#x524D;&#x898F;&#x5283;&#x6642;&#x9593;&#xFF0C;&#x78BA;&#x4FDD;&#x9806;&#x6642;&#x5B8C;&#x6210;&#x884C;&#x7A0B;</text>
  </g>

</svg>
